name: Build postmarketOS Vince Headless
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pmbootstrap
        run: |
          sudo apt update
          sudo apt install -y python3-pip git openssl android-sdk-libsparse-utils
          pip3 install --break-system-packages git+https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
      - name: Configure pmbootstrap
        run: |
          mkdir -p ~/.config
          cat << 'CFG' > ~/.config/pmbootstrap.cfg
[pmbootstrap]
work = /tmp/pmbootstrap
channel = edge
vendor = xiaomi
device = vince
ui = none
noninteractive = True
CFG
      - name: Build RootFS & Kernel
        run: |
          pmbootstrap -w /tmp/pmbootstrap install --extra-packages docker,openssh,networkmanager,iptables --no-fde
      - name: Export Image Artifacts
        run: |
          mkdir -p output
          pmbootstrap -w /tmp/pmbootstrap export ./output
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vince-pmos-headless-build
          path: output/*
